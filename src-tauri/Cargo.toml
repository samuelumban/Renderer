[workspace]
members = ["core"]

[package]
name = "universal-remotion-studio"
version = "0.1.0"
description = "Lightweight Windows desktop manager for Remotion projects"
edition = "2021"

[lib]
name = "urs_app"
path = "src/lib.rs"

[[bin]]
name = "universal-remotion-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urs-core = { path = "core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
